# Publishes the package to npm with a provenance attestation.
#
# n8n requires community nodes to be published from GitHub Actions with npm
# provenance (since May 1 2026). Provenance lets anyone verify that the
# package was built by this workflow, from this repository and commit.
#
# Triggers: a published GitHub release, or a pushed tag v*.
# `gh release create v0.1.0` fires both events. The "already published?"
# check below makes the second run a no-op.
#
# ── One-time setup (pick one) ───────────────────────────────────────────────
# A) npm Trusted Publishing (OIDC, recommended, no secrets):
#    npmjs.com → package → Settings → Trusted Publisher → GitHub Actions
#      Organization or user: hasibulrag
#      Repository:           n8n-nodes-bkash
#      Workflow filename:    publish.yml
#      Environment:          (leave empty)
#    A package that doesn't exist yet can't get a trusted publisher. Do the
#    very first publish with option B, then switch to A and delete the secret.
#
# B) Token fallback:
#    npmjs.com → Access Tokens → Granular token with "Read and write" on this
#    package (or "all packages" for the first publish), "Bypass 2FA" enabled.
#      gh secret set NPM_TOKEN --repo hasibulrag/n8n-nodes-bkash
# ────────────────────────────────────────────────────────────────────────────

name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  # Mint the OIDC token used for Trusted Publishing and provenance.
  id-token: write
  contents: read

# Never run two publishes for the same ref at once.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 20 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check tag matches package.json version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already on npm. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Lint
        if: steps.version.outputs.skip != 'true'
        run: npm run lint

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Offline tests
        if: steps.version.outputs.skip != 'true'
        run: node --test

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Lets `npm publish` through the n8n-node prerelease guard in prepublishOnly.
          RELEASE_MODE: 'true'
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Using NPM_TOKEN secret"
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "No NPM_TOKEN set, using npm Trusted Publishing (OIDC)"
          fi
          npm publish --provenance --access public
